name: Build (macOS)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and OpenCV
        run: brew install qt opencv ninja

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix opencv)"

      - name: Build
        run: cmake --build build --target SnookerPlayer
